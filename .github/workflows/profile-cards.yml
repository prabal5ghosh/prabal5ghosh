name: Update GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: prabal5ghosh
          cards: overview,contributions,languages
          output-dir: assets/github-stats
          themes: light,dark
          language-limit: 8
          commit: true
          commit-message: "Update GitHub profile statistics [skip ci]"
